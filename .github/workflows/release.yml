# Build the app for macOS (universal), Linux x86_64 + ARM64 (AppImage,
# .deb, .rpm) and Windows x64 (.msi, setup .exe).
#
# Every run builds and keeps the files as workflow artifacts:
# - Push a tag vX.Y.Z (equal to "version" in src-tauri/tauri.conf.json):
#   the release job then creates a DRAFT GitHub release with the files.
#   Review it, then publish it by hand.
# - Run it by hand (Actions > Release > Run workflow), or a pull request that
#   changes this file: build only. Use this to test a branch.
#
# macOS signing and notarization use repository secrets; see docs/RELEASING.md.
# Without them the macOS build is not signed. Windows signing uses Azure
# Artifact Signing secrets; without them the Windows build is not signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the AppImage runs on older glibc.
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    # The run steps are bash, also on Windows (Git Bash on the runner).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils

      - run: npm ci

      # Tauri signs when APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD
      # exist, even if empty, and GitHub gives a missing secret as "". So set
      # each variable only when its secret has a value.
      - name: macOS signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_env() { if [ -n "$2" ]; then echo "$1<<EOF_$1" >> "$GITHUB_ENV"; echo "$2" >> "$GITHUB_ENV"; echo "EOF_$1" >> "$GITHUB_ENV"; fi; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            set_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            set_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            set_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "Signing: on"
          else
            echo "::warning::macOS build is NOT signed: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD or APPLE_SIGNING_IDENTITY is missing."
          fi
          # Notarization: App Store Connect API key (preferred), or Apple ID.
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            set_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
            set_env APPLE_API_KEY "$APPLE_API_KEY"
            set_env APPLE_API_KEY_PATH "$key"
            echo "Notarization: API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            set_env APPLE_ID "$APPLE_ID"
            set_env APPLE_PASSWORD "$APPLE_PASSWORD"
            set_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "Notarization: Apple ID"
          else
            echo "::warning::macOS build is NOT notarized: no API key or Apple ID secrets."
          fi

      # The tauri-action README: "If you only want to build the app without
      # having the action upload any assets ... simply omit tagName,
      # releaseName and releaseId." The release job uploads instead, after
      # the .dmg is notarized.
      # Azure Artifact Signing, through Tauri's bundle.windows.signCommand.
      # The command is added with --config only when every value is set, so
      # a build without them still works (not signed).
      - name: Windows signing (Azure Artifact Signing)
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            if [ -z "${!v}" ]; then
              echo "::warning::Windows build is NOT signed: $v is missing."; exit 0
            fi
          done
          # A third-party crate (github.com/levminer/trusted-signing-cli):
          # pinned, with its lock file.
          cargo install artifact-signing-cli --version 0.12.0 --locked
          config="$(cygpath -m "$RUNNER_TEMP")/windows-sign.json"
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s %%1"}}}' \
            "$SIGNING_ENDPOINT" "$SIGNING_ACCOUNT" "$SIGNING_PROFILE" > "$config"
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "SIGN_ARGS=--config $config" >> "$GITHUB_ENV"
          echo "Signing: on"

      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.SIGN_ARGS != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not signed" }
          }

      # Tauri notarizes and staples the .app, but only signs the .dmg
      # (tauri-bundler src/bundle/macos/dmg/mod.rs). Notarize and staple the
      # .dmg too, so Gatekeeper accepts the downloaded file itself.
      - name: Notarize and staple the .dmg
        if: runner.os == 'macOS'
        run: |
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::.dmg is NOT notarized: it is not signed."; exit 0
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          elif [ -n "${APPLE_ID:-}" ]; then
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "::warning::.dmg is NOT notarized: no API key or Apple ID secrets."; exit 0
          fi
          for dmg in target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" "${auth[@]}" --wait
            # Fails if Apple did not accept the file.
            xcrun stapler staple "$dmg"
          done

      - name: Keep the files
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          # The workspace target folder: target/<triple>/release/bundle with
          # --target, target/release/bundle without. Only the final files,
          # not the work folders (.AppDir and so on) beside them.
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write # create the draft release and upload files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "SSH Config Manager $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Downloads for macOS (universal: Apple silicon and Intel), Linux x86_64 and ARM64 (AppImage, .deb, .rpm) and Windows x64 (.msi or setup .exe).
          See the README for how to install."
