<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSH Cfg Mgr</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">SSH Cfg Mgr</div>
      <code id="path" class="path"></code>
      <span id="badge" class="badge" hidden></span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload</button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-tools">
          <input id="search" type="search" placeholder="Filter hosts" autocomplete="off" spellcheck="false" />
          <button id="new-host" type="button" class="primary">New host</button>
        </div>
        <ul id="list" class="list" role="listbox" aria-label="Hosts"></ul>
        <p id="count" class="count"></p>
      </aside>

      <section class="detail">
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="detail" aria-live="polite"></div>
      </section>
    </main>

    <datalist id="keywords"></datalist>
  </body>
</html>
