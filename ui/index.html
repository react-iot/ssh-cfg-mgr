<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSH Cfg Mgr</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <picture>
          <source srcset="assets/logo-lockup-horizontal-dark.svg" media="(prefers-color-scheme: dark)" />
          <img src="assets/logo-lockup-horizontal.svg" alt="ReactIoT" />
        </picture>
        <span class="brand-sep" aria-hidden="true"></span>
        <span>SSH Cfg Mgr</span>
      </div>
      <code id="path" class="path"></code>
      <span id="badge" class="badge" hidden></span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload</button>
      <button id="settings" type="button" class="icon-only" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-tools">
          <div class="segmented">
            <input id="search" type="search" placeholder="Filter hosts" aria-label="Filter hosts" autocomplete="off" spellcheck="false" />
            <button id="sort" type="button" class="sort" data-sort="file">
              <svg class="sort-file" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5 2v12M2 11l3 3 3-3M11 14V2M8 5l3-3 3 3M2 14 14 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <svg class="sort-asc" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2v12M4 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <svg class="sort-desc" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 14V2M4 6l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button id="new-host" type="button" class="add" aria-label="New host" title="New host">+</button>
          </div>
        </div>
        <ul id="list" class="list" role="listbox" aria-label="Hosts"></ul>
        <div class="sidebar-foot">
          <p id="count" class="count"></p>
        </div>
      </aside>

      <section class="detail">
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="detail" aria-live="polite"></div>
      </section>
    </main>

    <datalist id="keywords"></datalist>
    <datalist id="groups"></datalist>
  </body>
</html>
