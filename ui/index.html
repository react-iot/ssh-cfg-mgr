<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSH Cfg Mgr</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <picture>
          <source srcset="assets/logo-lockup-horizontal-dark.svg" media="(prefers-color-scheme: dark)" />
          <img src="assets/logo-lockup-horizontal.svg" alt="ReactIoT" />
        </picture>
        <span class="brand-sep" aria-hidden="true"></span>
        <span>SSH Cfg Mgr</span>
      </div>
      <code id="path" class="path"></code>
      <span id="badge" class="badge" hidden></span>
      <span class="spacer"></span>
      <button id="reload" type="button">Reload</button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-tools">
          <div class="segmented">
            <button id="filter" type="button" aria-label="Filter hosts" title="Filter hosts" aria-expanded="false" aria-controls="search">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
            </button>
            <select id="sort" aria-label="Sort hosts">
              <option value="file">File order</option>
              <option value="name">Name A–Z</option>
            </select>
            <button id="new-host" type="button" class="add" aria-label="New host" title="New host">+</button>
          </div>
          <input id="search" type="search" placeholder="Filter hosts" autocomplete="off" spellcheck="false" hidden />
        </div>
        <ul id="list" class="list" role="listbox" aria-label="Hosts"></ul>
        <div class="sidebar-foot">
          <p id="count" class="count"></p>
          <label class="group-mode">
            Groups
            <select id="group-mode">
              <option value="comment"># group: comment</option>
              <option value="tag">Tag (OpenSSH 9.4+)</option>
            </select>
          </label>
        </div>
      </aside>

      <section class="detail">
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="detail" aria-live="polite"></div>
      </section>
    </main>

    <datalist id="keywords"></datalist>
    <datalist id="groups"></datalist>
  </body>
</html>
