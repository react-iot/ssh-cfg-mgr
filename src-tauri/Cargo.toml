[package]
name = "ssh-cfg-mgr"
version = "0.1.1"
description = "Desktop app to manage ~/.ssh/config and SSH keys"
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sshconfig-lossless = { path = "../crates/sshconfig-lossless" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
glob = "0.3"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
